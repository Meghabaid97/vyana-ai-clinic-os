name: CI

on:
  push:
    branches: [main, test]
  pull_request:
    branches: [main, test, release]
  workflow_dispatch:

jobs:
  test:
    name: Lint • Typecheck • Test • Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint
        continue-on-error: true

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Run Vitest
        run: npx vitest run

      - name: Build web bundle
        run: npm run build
